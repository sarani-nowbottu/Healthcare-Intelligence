services:
  - type: web
    name: healthcare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    region: singapore
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: healthcare-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: healthcare-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    plan: 0.5c-512mb
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-database
          property: connectionString
      - key: FLASK_SERVICE_URL
        fromService:
          type: pserv
          name: healthcare-flask
          property: hostport

  - type: pserv
    name: healthcare-flask
    runtime: python
    rootDir: flask_service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    plan: 1c-2g
    region: singapore
    disk:
      name: healthcare-policies
      mountPath: /var/data/healthcare-policies
      sizeGB: 1
    envVars:
      - key: POLICIES_DIR
        value: /var/data/healthcare-policies
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

databases:
  - name: healthcare-database
    databaseName: healthcare_intelligence
    user: healthcare_app
    plan: 0.1c-256mb
    region: singapore
