services:
  - type: web
    name: healthcare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: healthcare-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: healthcare-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-database
          property: connectionString
      - key: FLASK_SERVICE_URL
        fromService:
          type: web
          name: healthcare-flask
          envVarKey: RENDER_EXTERNAL_URL
      - key: FLASK_SERVICE_TOKEN
        fromService:
          type: web
          name: healthcare-flask
          envVarKey: FLASK_SERVICE_TOKEN

  - type: web
    name: healthcare-flask
    runtime: python
    rootDir: flask_service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    plan: free
    region: singapore
    envVars:
      - key: FLASK_SERVICE_TOKEN
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

databases:
  - name: healthcare-database
    databaseName: healthcare_intelligence
    user: healthcare_app
    plan: free
    region: singapore
